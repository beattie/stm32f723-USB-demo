[package]
name = "stm32f723-passthrough-demo"
version = "0.1.0"
edition = "2024"

[dependencies]
embassy-executor = { version = "0.6", features = [
        "arch-cortex-m",
        "executor-thread",
        "integrated-timers"
]}
embassy-stm32 = { version = "0.1", features = [
        "stm32f723ve",
        "time-driver-tim2",
        "exti"
]}
embassy-time = "0.3"
cortex-m = { version = "0.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7"
panic-halt = "0.2"
